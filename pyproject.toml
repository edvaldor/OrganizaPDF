[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "organizapdf"
version = "1.1.0"
description = "Aplicativo desktop para unir e separar PDFs preservando marcadores, links e anotações."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edvaldo Rodrigues" }]
keywords = ["pdf", "merge", "desktop", "pyside6", "pypdf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Environment :: X11 Applications :: Qt",
  "Natural Language :: Portuguese (Brazilian)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "pypdf>=6.10,<7",
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.10,<7",
  "ruff>=0.12,<1",
]

[project.gui-scripts]
organizapdf = "organizapdf.app:main"

[project.urls]
Homepage = "https://github.com/edvaldor/OrganizaPDF"
Issues = "https://github.com/edvaldor/OrganizaPDF/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
organizapdf = ["assets/*.svg", "assets/*.ico"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
